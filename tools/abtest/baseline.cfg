// baseline.cfg — fixed cvar pins for levelmesh A/B runs (tickets 09/10).
// Loaded via -exec in every baseline/perf run. Per-run values (resolution,
// backend, perflog path, demo) are passed on the command line — see
// README.md. Kept deliberately small: 09 locks gamma 1.0 + default cvars,
// so everything not pinned here stays at engine defaults.
set vid_vsync 0
set vid_maxfps 0
// gamma 1.0 (the SettingsPage gamma components at their defaults):
set vid_fixgamma 0
set vid_contrast 1
set vid_saturation 1
